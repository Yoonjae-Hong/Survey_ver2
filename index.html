<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Floorplan Tool</title>

<style>
  :root {
    /* 방 타입별 메인 색상 (단 1곳만 수정하면 모든 UI에 반영됨) */
    --color-Living-room: #3B82F6;
    --color-Kitchen: #22C55E;
    --color-Bedroom: #8B5CF6;
    --color-Bathroom: #EF4444;
    --color-Storage: #FACC15;
    --color-Balcony: #F97316;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    background: #f5f5f7;
    color: #222;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .header {
    padding: 12px 20px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .header-title { font-size: 18px; font-weight: 600; }
  .header-subtitle { font-size: 13px; color: #666; }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 12px;
    padding: 12px;
  }

  .panel {
    background: white;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
  }

  .palette-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }

  .palette-section-title {
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 600;
    color: #555;
  }

  /* ------------------------------
     🎨 팔레트 색상 자동 적용 로직
     ------------------------------ */
  .shape-item {
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
    background: #fafafa;
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: grab;
  }

  .shape-preview {
    min-width: 40px;
    min-height: 30px;
    border-radius: 4px;
    border: 2px solid #ccc;
    font-size: 11px;
    color: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }

  /* ⭐ 자동 색상 매핑 (기본 구조 유지, 코드 매우 짧음) */
  .shape-item[data-room-type] {
    background: color-mix(in srgb, var(--color-attr), 12%);
  }

  .shape-item[data-room-type] .shape-preview {
    border-color: var(--color-attr);
    color: var(--color-attr);
  }

  /* 각 타입에서 CSS 변수 var(--color-attr) 바인딩 */
  .shape-item[data-room-type="Living room"] { --color-attr: var(--color-Living-room); }
  .shape-item[data-room-type="Kitchen"]     { --color-attr: var(--color-Kitchen); }
  .shape-item[data-room-type="Bedroom"]     { --color-attr: var(--color-Bedroom); }
  .shape-item[data-room-type="Bathroom"]    { --color-attr: var(--color-Bathroom); }
  .shape-item[data-room-type="Storage"]     { --color-attr: var(--color-Storage); }
  .shape-item[data-room-type="Balcony"]     { --color-attr: var(--color-Balcony); }

  /* 캔버스 */
  .canvas {
    flex: 1;
    position: relative;
    background:
      linear-gradient(#e0e0e0 1px, transparent 1px),
      linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
  }

  .canvas-drop-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    pointer-events: none;
  }

  .canvas-shape {
    position: absolute;
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    padding: 4px;
    cursor: move;
  }

  .canvas-shape.selected {
    outline: 2px solid #1d4ed8;
  }

  textarea {
    width: 100%;
    height: 120px;
    resize: vertical;
    font-size: 11px;
    margin-top: 8px;
    padding: 6px;
  }
</style>
</head>

<body>
<div class="app-container">

<header class="header">
  <div>
    <div class="header-title">Floorplan Arrangement Experiment Tool</div>
    <div class="header-subtitle">Drag items to the canvas. Press Delete to remove.</div>
  </div>
</header>

<main class="main">
  <!-- PALETTE -->
  <section class="panel">
    <div class="palette-section-title">Living Room</div>
    <div class="shape-item" draggable="true"
         data-room-type="Living room" data-width="120" data-height="80">
      <div class="shape-preview">LR S</div>
      <div>Living room – Small</div>
    </div>

    <div class="palette-section-title">Kitchen</div>
    <div class="shape-item" draggable="true"
         data-room-type="Kitchen" data-width="100" data-height="70">
      <div class="shape-preview">K S</div>
      <div>Kitchen – Small</div>
    </div>

    <div class="palette-section-title">Bedroom</div>
    <div class="shape-item" draggable="true"
         data-room-type="Bedroom" data-width="110" data-height="70">
      <div class="shape-preview">BR S</div>
      <div>Bedroom – Small</div>
    </div>

    <div class="palette-section-title">Bathroom</div>
    <div class="shape-item" draggable="true"
         data-room-type="Bathroom" data-width="60" data-height="50">
      <div class="shape-preview">BA S</div>
      <div>Bathroom – Small</div>
    </div>

    <div class="palette-section-title">Storage</div>
    <div class="shape-item" draggable="true"
         data-room-type="Storage" data-width="50" data-height="50">
      <div class="shape-preview">ST S</div>
      <div>Storage – Small</div>
    </div>

    <div class="palette-section-title">Balcony</div>
    <div class="shape-item" draggable="true"
         data-room-type="Balcony" data-width="80" data-height="40">
      <div class="shape-preview">BL S</div>
      <div>Balcony – Small</div>
    </div>
  </section>

  <!-- CANVAS -->
  <section class="panel canvas-wrapper">
    <div class="canvas" id="canvas">
      <div class="canvas-drop-hint" id="dropHint">Drop items here</div>
    </div>

    <textarea id="layoutOutput" readonly></textarea>
  </section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const GRID_SIZE = 10;
const ROOM_COLORS = {
  "Living room": "rgba(59,130,246,0.25)",
  "Kitchen":     "rgba(34,197,94,0.25)",
  "Bedroom":     "rgba(139,92,246,0.25)",
  "Bathroom":    "rgba(239,68,68,0.25)",
  "Storage":     "rgba(250,204,21,0.25)",
  "Balcony":     "rgba(249,115,22,0.25)"
};

const canvas = document.getElementById("canvas");
const dropHint = document.getElementById("dropHint");
const layoutOutput = document.getElementById("layoutOutput");

let shapes = [];
let dragged = null;
let idCount = 1;

/* -------- Palette drag start -------- */
document.addEventListener("dragstart", (e) => {
  const item = e.target.closest(".shape-item");
  if (!item) return;

  dragged = {
    roomType: item.dataset.roomType,
    width: parseInt(item.dataset.width),
    height: parseInt(item.dataset.height)
  };
});

/* -------- Canvas drop -------- */
canvas.addEventListener("dragover", (e) => e.preventDefault());
canvas.addEventListener("drop", (e) => {
  if (!dragged) return;

  const rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left - dragged.width/2;
  let y = e.clientY - rect.top - dragged.height/2;
  x = Math.round(x/GRID_SIZE)*GRID_SIZE;
  y = Math.round(y/GRID_SIZE)*GRID_SIZE;

  createShape(dragged.roomType, x, y, dragged.width, dragged.height);
  dragged = null;
});

/* -------- Shape Creation -------- */
function createShape(type, x, y, w, h) {
  dropHint.style.display = "none";

  const el = document.createElement("div");
  const id = "shape_" + idCount++;

  el.className = "canvas-shape";
  el.dataset.id = id;
  el.style.background = ROOM_COLORS[type];
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.width = w + "px";
  el.style.height = h + "px";
  el.innerHTML = `<b>${type}</b>`;

  canvas.appendChild(el);
  shapes.push({ id, type, x, y, w, h });

  addDragMove(el);
  updateJSON();
}

/* -------- Drag Move -------- */
function addDragMove(el) {
  el.addEventListener("mousedown", (e) => {
    const startX = e.clientX;
    const startY = e.clientY;
    const baseX = parseInt(el.style.left);
    const baseY = parseInt(el.style.top);

    function move(ev) {
      let nx = baseX + (ev.clientX - startX);
      let ny = baseY + (ev.clientY - startY);
      nx = Math.round(nx/GRID_SIZE)*GRID_SIZE;
      ny = Math.round(ny/GRID_SIZE)*GRID_SIZE;

      el.style.left = nx+"px";
      el.style.top  = ny+"px";

      const s = shapes.find(s => s.id === el.dataset.id);
      s.x = nx; s.y = ny;
      updateJSON();
    }

    function up() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}

/* -------- JSON Output -------- */
function updateJSON() {
  layoutOutput.value = JSON.stringify(shapes, null, 2);
}
</script>

</body>
</html>
