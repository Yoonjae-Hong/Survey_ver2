<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Floorplan Design Tool</title>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 0; background:#f5f5f7; color:#222; }

    .app-container { display:flex; flex-direction:column; height:100vh; }

    .header { padding:12px 20px; background:#fff; border-bottom:1px solid #ddd; }
    .header-title { font-size:18px; font-weight:600; }

    /* 🔹 3-column layout */
    .main {
      flex:1;
      display:grid;
      grid-template-columns:260px 2.3fr 1fr;
      gap:12px;
      padding:12px;
    }

    .panel {
      background:#fff;
      border-radius:14px;
      padding:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.04);
      display:flex;
      flex-direction:column;
    }

    .instruction-bar {
      font-size:12px; color:#555;
      background:#f0f0f0;
      padding:6px 10px;
      border-radius:8px;
      border:1px solid #ddd;
      margin-bottom:8px;
      line-height:1.4;
    }

    .canvas {
      position:relative;
      flex:1;
      min-height:360px;
      border:1px solid #ccc;
      background:
        linear-gradient(#e0e0e0 1px, transparent 1px),
        linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
      background-size: 18px 18px;
      overflow:hidden;
    }

    .compass {
      position:absolute;
      top:10px; right:10px;
      width:70px; height:70px;
      border-radius:50%;
      background:rgba(255,255,255,0.9);
      border:2px solid #555;
      z-index:20;
    }
    .compass div { position:absolute; font-weight:700; font-size:13px; }
    .north { top:4px; left:50%; transform:translateX(-50%); }
    .east  { right:4px; top:50%; transform:translateY(-50%); }
    .south { bottom:4px; left:50%; transform:translateX(-50%); }
    .west  { left:4px; top:50%; transform:translateY(-50%); }

    .person-icon {
      position:absolute;
      width:35px;
      height:45px;
      cursor:move;
      z-index:18;
    }

    .canvas-shape {
      position:absolute;
      border:1px solid rgba(0,0,0,0.3);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:11px;
      cursor:move;
      padding:3px;
      text-align:center;
    }

    textarea {
      width:100%;
      resize:none;
      padding:8px;
      font-size:12px;
      border-radius:8px;
      border:1px solid #ddd;
      background:#fafafa;
    }

    .btn { padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer; border:1px solid #ccc; }
    .btn-primary { background:#2563eb; color:white; border-color:#2563eb; }
  </style>
</head>

<body>
<div class="app-container">

<header class="header">
  <div class="header-title">Floorplan Design Tool</div>
</header>

<main class="main">

  <!-- LEFT PANEL -->
  <section class="panel">
    <h3>Create a Room</h3>
    <label>Room Type</label>
    <select id="customRoomType">
      <option>Living Room</option>
      <option>Kitchen</option>
      <option>Dining Room</option>
      <option>Master Bedroom</option>
      <option>Guest Bedroom</option>
      <option>Bathroom</option>
      <option value="Others">Others</option>
    </select>

    <label>Width</label>
    <input id="customWidth" type="number" value="10">
    <label>Height</label>
    <input id="customHeight" type="number" value="8">

    <button id="addCustomRoomBtn" class="btn btn-primary">Add Room</button>
    <hr>
    <button id="exportJsonBtn" class="btn btn-primary">Save PNG + JSON + TEXT</button>
  </section>

  <!-- CANVAS PANEL -->
  <section class="panel">
    <div class="instruction-bar">
      Drag rooms to design your layout
    </div>

    <div class="canvas" id="canvas">
      <div class="compass">
        <div class="north">N</div><div class="east">E</div>
        <div class="south">S</div><div class="west">W</div>
      </div>
      <img id="personIcon" class="person-icon"
        src="https://raw.githubusercontent.com/Yoonjae-Hong/Survey_ver2/76437d43f2a49ee041422c151b7c6ec6c5576320/Assets/person.png">
    </div>
  </section>

  <!-- 🆕 TEXT PANEL -->
  <section class="panel">
    <h3>Spatial Description</h3>
    <textarea id="textDescription" style="flex:1;"
      placeholder="Describe your ideal home layout, adjacencies, circulation, orientation, etc."></textarea>
  </section>

</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
document.getElementById("exportJsonBtn").addEventListener("click", async () => {
  const text = document.getElementById("textDescription").value;

  // TEXT FILE
  const txtBlob = new Blob([text], { type:"text/plain" });
  const txtUrl = URL.createObjectURL(txtBlob);
  const aTxt = document.createElement("a");
  aTxt.href = txtUrl;
  aTxt.download = "description.txt";
  aTxt.click();

  // PNG
  const canvasEl = document.getElementById("canvas");
  const shot = await html2canvas(canvasEl, { scale:2 });
  shot.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "layout.png";
    a.click();
  });
});
</script>

</body>
</html>
